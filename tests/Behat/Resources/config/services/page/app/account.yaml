services:
    _defaults:
        autowire: false
        autoconfigure: false
        public: false

    test.behat.page:
        class: FriendsOfBehat\PageObjectExtension\Page\SymfonyPage
        arguments:
            - '@behat.mink.default_session'
            - '@behat.mink.parameters'
            - '@router'

    test.behat.page.app.login:
        class: App\Tests\Behat\Page\App\LoginPage
        parent: test.behat.page

    test.behat.page.app.dashboard:
        class: App\Tests\Behat\Page\App\DashboardPage
        parent: test.behat.page
