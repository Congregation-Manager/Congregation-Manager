services:
    _defaults:
        autowire: false
        autoconfigure: false
        public: false

    test.behat.page:
        class: FriendsOfBehat\PageObjectExtension\Page\SymfonyPage
        arguments:
            - '@behat.mink.default_session'
            - '@behat.mink.parameters'
            - '@router'

    test.behat.page.app.home:
        class: App\Tests\Behat\Page\App\HomePage
        parent: test.behat.page

    test.behat.page.app.login:
        class: App\Tests\Behat\Page\App\LoginPage
        parent: test.behat.page

    test.behat.page.app.dashboard:
        class: App\Tests\Behat\Page\App\DashboardPage
        parent: test.behat.page

    test.behat.page.app.forgot_password:
        class: App\Tests\Behat\Page\App\ForgotPasswordPage
        parent: test.behat.page

    test.behat.page.app.check_email:
        class: App\Tests\Behat\Page\App\CheckEmailPage
        parent: test.behat.page

    test.behat.page.app.reset_password:
        class: App\Tests\Behat\Page\App\ResetPasswordPage
        parent: test.behat.page

    test.behat.page.app.profile_update:
        class: App\Tests\Behat\Page\App\ProfileUpdatePage
        parent: test.behat.page

    test.behat.page.app.change_password:
        class: App\Tests\Behat\Page\App\ChangePasswordPage
        parent: test.behat.page

    test.behat.page.admin.login:
        class: App\Tests\Behat\Page\Admin\LoginPage
        parent: test.behat.page

    test.behat.page.admin.dashboard:
        class: App\Tests\Behat\Page\Admin\DashboardPage
        parent: test.behat.page

    test.behat.page.admin.forgot_password:
        class: App\Tests\Behat\Page\Admin\ForgotPasswordPage
        parent: test.behat.page

    test.behat.page.admin.check_email:
        class: App\Tests\Behat\Page\Admin\CheckEmailPage
        parent: test.behat.page

    test.behat.page.admin.reset_password:
        class: App\Tests\Behat\Page\Admin\ResetPasswordPage
        parent: test.behat.page

    test.behat.page.admin.profile_update:
        class: App\Tests\Behat\Page\Admin\ProfileUpdatePage
        parent: test.behat.page

    test.behat.page.admin.change_password:
        class: App\Tests\Behat\Page\Admin\ChangePasswordPage
        parent: test.behat.page
