services:
    _defaults:
        autowire: false
        autoconfigure: false
        public: true

    test.behat.context.ui.app.account:
        class: App\Tests\Behat\Context\Ui\App\AccountContext
        arguments:
            - '@test.behat.page.app.login'
            - '@test.behat.page.app.dashboard'
            - '@test.behat.page.app.forgot_password'
            - '@test.behat.page.app.check_email'
            - '@test.behat.page.app.reset_password'
            - '@test.behat.shared_storage'

    test.behat.context.ui.admin.account:
        class: App\Tests\Behat\Context\Ui\Admin\AccountContext
        arguments:
            - '@test.behat.page.admin.login'
            - '@test.behat.page.admin.dashboard'
            - '@test.behat.page.admin.forgot_password'
            - '@test.behat.page.admin.check_email'
            - '@test.behat.page.admin.reset_password'
            - '@test.behat.shared_storage'

    test.behat.context.ui.email:
        class: App\Tests\Behat\Context\Ui\EmailContext
        arguments:
            - '@test.behat.email_checker'
