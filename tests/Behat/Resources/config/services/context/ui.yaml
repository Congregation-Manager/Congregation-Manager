services:
    _defaults:
        autowire: false
        autoconfigure: false
        public: true

    cm.test.behat.context.ui.app.account:
        class: CongregationManager\Tests\Behat\Context\Ui\App\AccountContext
        arguments:
            - '@cm.test.behat.page.app.login'
            - '@cm.test.behat.page.app.dashboard'
            - '@cm.test.behat.page.app.forgot_password'
            - '@cm.test.behat.page.app.check_email'
            - '@cm.test.behat.page.app.reset_password'
            - '@cm.test.behat.page.app.profile_update'
            - '@cm.test.behat.shared_storage'
            - '@cm.test.behat.page.app.change_password'
            - '@cm.test.behat.page.app.complete_account'

    cm.test.behat.context.ui.app.locale:
        class: CongregationManager\Tests\Behat\Context\Ui\App\LocaleContext
        arguments:
            - '@cm.test.behat.page.app.home'

    cm.test.behat.context.ui.app.territory:
        class: CongregationManager\Tests\Behat\Context\Ui\App\TerritoryContext
        arguments:
            - '@cm.test.behat.page.app.territory.assign'
            - '@cm.test.behat.page.app.territory.show'

    cm.test.behat.context.ui.admin.account:
        class: CongregationManager\Tests\Behat\Context\Ui\Admin\AccountContext
        arguments:
            - '@cm.test.behat.page.admin.login'
            - '@cm.test.behat.page.admin.dashboard'
            - '@cm.test.behat.page.admin.forgot_password'
            - '@cm.test.behat.page.admin.check_email'
            - '@cm.test.behat.page.admin.reset_password'
            - '@cm.test.behat.shared_storage'
            - '@cm.test.behat.page.admin.profile_update'
            - '@cm.test.behat.page.admin.change_password'
            - '@cm.test.behat.page.admin.brother_show'
            - '@cm.test.behat.page.admin.invite_app_user'

    cm.test.behat.context.ui.admin.locale:
        class: CongregationManager\Tests\Behat\Context\Ui\Admin\LocaleContext
        arguments:
            - '@cm.test.behat.page.admin.login'

    cm.test.behat.context.ui.email:
        class: CongregationManager\Tests\Behat\Context\Ui\EmailContext
        arguments:
            - '@cm.test.behat.email_checker'
