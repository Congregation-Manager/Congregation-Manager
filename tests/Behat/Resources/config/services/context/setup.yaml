services:
    _defaults:
        autowire: false
        autoconfigure: false
        public: true

    cm.test.behat.context.setup.account:
        class: CongregationManager\Tests\Behat\Context\Setup\AccountContext
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@security.password_hasher'
            - '@symfonycasts.reset_password.token_generator'
            - '@cm.test.behat.shared_storage'
            - '@cm.repository.reset_password_request'
            - '@cm.converter.locale'
            - '@cm.create_app_user_invitation'
            - '@cm.test.behat.app_security'

    cm.test.behat.context.setup.browser:
        class: CongregationManager\Tests\Behat\Context\Setup\BrowserContext
        arguments:
            - '@behat.mink.default_session'
            - '@cm.converter.locale'

    cm.test.behat.context.setup.congregation:
        class: CongregationManager\Tests\Behat\Context\Setup\CongregationContext
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@cm.test.behat.shared_storage'

    cm.test.behat.context.setup.brother:
        class: CongregationManager\Tests\Behat\Context\Setup\BrotherContext
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@cm.test.behat.shared_storage'

    cm.test.behat.context.setup.territory:
        class: CongregationManager\Tests\Behat\Context\Setup\TerritoryContext
        arguments:
            - '@cm.test.behat.shared_storage'
            - '@cm.repository.territory'
            - '@doctrine.orm.entity_manager'
