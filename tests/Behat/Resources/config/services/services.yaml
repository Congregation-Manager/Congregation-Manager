services:
    _defaults:
        autowire: false
        autoconfigure: false
        public: false

    cm.test.behat.email_checker:
        class: CongregationManager\Tests\Behat\Services\EmailChecker

    cm.test.behat.mailer_factory:
        class: CongregationManager\Tests\Behat\Services\BehatMailerFactory
        arguments:
            - '@cm.test.behat.mailer_transport'
        tags:
            - {name: 'mailer.transport_factory'}

    cm.test.behat.mailer_transport:
        class: CongregationManager\Tests\Behat\Services\FakeMailerTransport
        arguments:
            - '@twig'

    cm.test.behat.shared_storage:
        class: CongregationManager\Tests\Behat\Services\SharedStorage

    cm.test.behat.setter.cookie:
        class: CongregationManager\Tests\Behat\Services\Setter\CookieSetter
        arguments:
            - '@behat.mink.default_session'

    cm.test.behat.app_security:
        class: CongregationManager\Tests\Behat\Services\SecurityService
        arguments:
            - '@session.factory'
            - '@cm.test.behat.setter.cookie'
            - 'app'
