name: 'Packages Split'

on:
    push:
        branches:
            - master
        tags:
            - '*'

env:
    GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}

jobs:
    check_token:
        runs-on: ubuntu-latest
        steps:
            -
                name: "Verify the token can push to the split repositories"
                env:
                    GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
                run: |
                    if [ -z "$GH_TOKEN" ]; then
                        echo "::error::ACCESS_TOKEN is not set"
                        exit 1
                    fi
                    push_allowed=$(gh api repos/${{ github.repository_owner }}/core-bundle --jq '.permissions.push')
                    if [ "$push_allowed" != "true" ]; then
                        echo "::error::ACCESS_TOKEN cannot push to the split repositories: renew it"
                        exit 1
                    fi

    packages_split:
        needs: check_token
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                # define package to repository map
                package:
                    -
                        local_path: 'src/CongregationManager/Contract/Resource'
                        split_repository: 'resource-contract'
                    -
                        local_path: 'src/CongregationManager/Component/Congregation'
                        split_repository: 'congregation'
                    -
                        local_path: 'src/CongregationManager/Component/Core'
                        split_repository: 'core'
                    -
                        local_path: 'src/CongregationManager/Component/TerritoryManager'
                        split_repository: 'territory-manager'
                    -
                        local_path: 'src/CongregationManager/Component/User'
                        split_repository: 'user'
                    -
                        local_path: 'src/CongregationManager/Bundle/Admin'
                        split_repository: 'admin-bundle'
                    -
                        local_path: 'src/CongregationManager/Bundle/App'
                        split_repository: 'app-bundle'
                    -
                        local_path: 'src/CongregationManager/Bundle/Congregation'
                        split_repository: 'congregation-bundle'
                    -
                        local_path: 'src/CongregationManager/Bundle/Core'
                        split_repository: 'core-bundle'
                    -
                        local_path: 'src/CongregationManager/Bundle/Resource'
                        split_repository: 'resource-bundle'
                    -
                        local_path: 'src/CongregationManager/Bundle/TerritoryManager'
                        split_repository: 'territory-manager-bundle'
                    -
                        local_path: 'src/CongregationManager/Bundle/User'
                        split_repository: 'user-bundle'
        steps:
            -
                uses: actions/checkout@v4

            # no tag
            -
                if: "!startsWith(github.ref, 'refs/tags/')"
                uses: "symplify/monorepo-split-github-action@v2.4.5"
                with:
                    package_directory: '${{ matrix.package.local_path }}'

                    repository_organization: 'Congregation-Manager'
                    repository_name: '${{ matrix.package.split_repository }}'

                    user_name: "lruozzi9"
                    user_email: "lruozzi@outlook.it"

            # with tag
            -
                if: "startsWith(github.ref, 'refs/tags/')"
                uses: "symplify/monorepo-split-github-action@v2.4.5"
                with:
                    tag: ${GITHUB_REF#refs/tags/}

                    package_directory: '${{ matrix.package.local_path }}'

                    repository_organization: 'Congregation-Manager'
                    repository_name: '${{ matrix.package.split_repository }}'

                    user_name: "lruozzi9"
                    user_email: "lruozzi@outlook.it"
