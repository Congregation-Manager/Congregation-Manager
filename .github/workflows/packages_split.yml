name: 'Packages Split'

on:
    push:
        branches:
            - master
        tags:
            - '*'

env:
    GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}

jobs:
    packages_split:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                # define package to repository map
                package:
                    -
                        local_path: 'src/CongregationManager/Bundle/Admin'
                        split_repository: 'admin-bundle'
                    -
                        local_path: 'src/CongregationManager/Bundle/App'
                        split_repository: 'app-bundle'

        steps:
            -
                uses: actions/checkout@v4

            # no tag
            -
                if: "!startsWith(github.ref, 'refs/tags/')"
                uses: "symplify/monorepo-split-github-action@v2.3.0"
                with:
                    package_directory: '${{ matrix.package.local_path }}'

                    repository_organization: 'Congregation-Manager'
                    repository_name: '${{ matrix.package.split_repository }}'

                    user_name: "lruozzi9"
                    user_email: "lruozzi@outlook.it"

            # with tag
            -
                if: "startsWith(github.ref, 'refs/tags/')"
                uses: "symplify/monorepo-split-github-action@v2.3.0"
                with:
                    tag: ${GITHUB_REF#refs/tags/}

                    package_directory: '${{ matrix.package.local_path }}'

                    repository_organization: 'Congregation-Manager'
                    repository_name: '${{ matrix.package.split_repository }}'

                    user_name: "lruozzi9"
                    user_email: "lruozzi@outlook.it"
