parameters:
    security.admin_regex: "^/%app_admin.path_name%"
    security.admin_with_locale_regex: "%security.admin_regex%/(%supported_locales%)"
    security.app_regex: "^/(?!%app_admin.path_name%)"

security:
    enable_authenticator_manager: true
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        CongregationManager\Entity\User\AppUser:
            algorithm: auto

    role_hierarchy:
        ROLE_SUPER_ADMIN: [ ROLE_ADMIN ]

    providers:
        app_user_provider:
            entity:
                class: CongregationManager\Bundle\User\Model\AppUser
                property: email
        admin_user_provider:
            entity:
                class: CongregationManager\Bundle\User\Model\AdminUser
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        admin:
            lazy: true
            provider: admin_user_provider
            pattern: "%security.admin_regex%"
            form_login:
                login_path: admin_login
                check_path: admin_login_check
                enable_csrf: true
                default_target_path: admin_dashboard
            logout:
                path: admin_logout
                target: app_homepage
                invalidate_session: false
            remember_me:
                secret: '%kernel.secret%'
                name: ADMIN_REMEMBER_ME
                lifetime: 2629746
                path: '/%app_admin.path_name%'
        app:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login_check
                enable_csrf: true
                default_target_path: app_dashboard
            logout:
                path: app_logout
                target: app_homepage
                invalidate_session: false
            remember_me:
                secret: '%kernel.secret%'
                name: REMEMBERME
                path: /

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: "%security.app_regex%$", role: PUBLIC_ACCESS }

        - { path: "%security.admin_regex%/$", role: PUBLIC_ACCESS }

        - { path: "%security.app_regex%login", role: PUBLIC_ACCESS }
        - { path: "%security.app_regex%reset-password", role: PUBLIC_ACCESS }
        - { path: "%security.app_regex%switch-locale", role: PUBLIC_ACCESS }
        - { path: "%security.app_regex%complete/account", role: PUBLIC_ACCESS }

        - { path: "%security.admin_regex%/login", role: PUBLIC_ACCESS }
        - { path: "%security.admin_regex%/reset-password", role: PUBLIC_ACCESS }
        - { path: "%security.admin_regex%/switch-locale", role: PUBLIC_ACCESS }

        #- { path: '%security.admin_regex%/users', roles: ROLE_SUPER_ADMIN }
        - { path: "%security.admin_regex%/.*", role: ROLE_ADMIN }

        - { path: "%security.app_regex%.*", role: ROLE_USER }
