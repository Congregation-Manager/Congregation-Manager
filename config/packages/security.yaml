parameters:
    security.admin_regex: "^/%app_admin.path_name%"
    security.admin_with_locale_regex: "%security.admin_regex%/(%supported_locales%)"
    security.app_regex: "^/(?!%supported_locales%|%app_admin.path_name%)"

security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        CongregationManager\Entity\User\AppUser:
            algorithm: auto

    role_hierarchy:
        ROLE_SUPER_ADMIN: [ ROLE_ADMIN ]

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: CongregationManager\Bundle\User\Entity\AppUser
                property: email
        admin_user_provider:
            entity:
                class: CongregationManager\Bundle\User\Entity\AdminUser
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        admin:
            lazy: true
            provider: admin_user_provider
            pattern: "%security.admin_regex%"
            form_login:
                login_path: admin_login
                check_path: admin_login_check
                enable_csrf: true
                default_target_path: admin_dashboard
            logout:
                path: admin_logout
                target: app_homepage
                invalidate_session: false
            remember_me:
                secret: '%kernel.secret%'
                name: ADMIN_REMEMBER_ME
                lifetime: 2629746
                path: '/%app_admin.path_name%'
        app:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: congregation_manager_app_login
                check_path: congregation_manager_app_login_check
                enable_csrf: true
                default_target_path: app_dashboard
            logout:
                path: congregation_manager_app_logout
                target: congregation_manager_app_homepage
                invalidate_session: false
            remember_me:
                secret: '%kernel.secret%'
                name: REMEMBERME
                path: /

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: "%security.app_regex%$", role: PUBLIC_ACCESS }

        - { path: "%security.admin_regex%/$", role: PUBLIC_ACCESS }

        - { path: "%security.app_regex%login", role: PUBLIC_ACCESS }
        - { path: "%security.app_regex%reset-password", role: PUBLIC_ACCESS }
        - { path: "%security.app_regex%switch-locale", role: PUBLIC_ACCESS }
        - { path: "%security.app_regex%complete/account", role: PUBLIC_ACCESS }

        - { path: "%security.admin_regex%/login", role: PUBLIC_ACCESS }
        - { path: "%security.admin_regex%/reset-password", role: PUBLIC_ACCESS }
        - { path: "%security.admin_regex%/switch-locale", role: PUBLIC_ACCESS }

        #- { path: '%security.admin_regex%/users', roles: ROLE_SUPER_ADMIN }
        - { path: "%security.admin_regex%/.*", role: ROLE_ADMIN }

        - { path: "%security.app_regex%.*", role: ROLE_USER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
