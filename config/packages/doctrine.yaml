doctrine:
    dbal:
        default_connection: default
        connections:
            default:
                url: '%env(resolve:DATABASE_URL)%'
            old_cm:
                url: '%env(resolve:OLD_CM_DATABASE_URL)%'

    orm:
        auto_generate_proxy_classes: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            User:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/config/doctrine/user'
                prefix: 'CongregationManager\Infrastructure\User\Model'
                alias: CongregationManager\User
            Congregation:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/config/doctrine/congregation'
                prefix: 'CongregationManager\Domain\Congregation\Model'
                alias: CongregationManager\Congregation
            Territory:
                is_bundle: false
                type: xml
                dir: '%kernel.project_dir%/config/doctrine/territory'
                prefix: 'CongregationManager\Domain\Territory\Model'
                alias: CongregationManager\Territory

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
