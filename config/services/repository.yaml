services:
    _defaults:
        autowire: false
        autoconfigure: false
        public: false

    cm.repository.app_user:
        alias: 'CongregationManager\Infrastructure\User\Repository\AppUserRepository'

    CongregationManager\Infrastructure\User\Repository\AppUserRepository:
        arguments:
            - '@doctrine'
        tags:
            - { name: doctrine.repository_service }

    cm.repository.admin_user:
        alias: 'CongregationManager\Infrastructure\User\Repository\AdminUserRepository'

    CongregationManager\Infrastructure\User\Repository\AdminUserRepository:
