services:
    _defaults:
        autowire: false
        autoconfigure: false
        public: false

    cm.command.create_congregation:
        class: CongregationManager\Infrastructure\Congregation\Command\CreateCongregationCommand
        arguments:
            - '@cm.utils.validator'
            - '@cm.create_congregation'
            - '@doctrine.orm.entity_manager'
            - 'app:create-congregation'
        tags:
            - { name: 'console.command' }

    cm.command.create_user:
        class: CongregationManager\Infrastructure\User\Command\AddUserCommand
        arguments:
            - '@doctrine.orm.entity_manager'
            - '@security.user_password_hasher'
            - '@cm.utils.validator'
            - '@cm.repository.app_user'
            - '@cm.repository.admin_user'
        tags:
            - { name: 'console.command', command: 'app:add-user', description: 'Creates users and stores them in the database' }
