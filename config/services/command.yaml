services:
    _defaults:
        autowire: false
        autoconfigure: false
        public: false

    cm.command.create_congregation:
        class: CongregationManager\Infrastructure\Congregation\Command\CreateCongregationCommand
        arguments:
            - '@cm.utils.validator'
            - '@cm.create_congregation'
            - '@doctrine.orm.entity_manager'
            - 'app:create-congregation'
        tags:
            - { name: 'console.command' }

    cm.command.create_admin_user:
        class: CongregationManager\Infrastructure\User\Command\CreateAdminUserCommand
        arguments:
            - '@cm.create_admin_user'
            - '@doctrine.orm.entity_manager'
            - '@cm.utils.validator'
            - '%default_locale%'
            - '%supported_locales%'
            - 'app:create-admin-user'
        tags:
            - { name: 'console.command' }
