services:
    _defaults:
        autowire: false
        autoconfigure: false
        public: false

    cm.create_congregation:
        class: CongregationManager\Component\Congregation\Application\CreateCongregation
        arguments:
            - '@cm.repository.congregation'

    cm.create_brother:
        class: CongregationManager\Component\Congregation\Application\CreateBrother
        arguments:
            - '@cm.repository.brother'

    cm.create_app_user:
        class: CongregationManager\Bundle\User\Action\CreateAppUser
        arguments:
            - '@cm.repository.app_user'
            - '@cm.hasher.user_password'

    cm.create_admin_user:
        class: CongregationManager\Bundle\User\Action\CreateAdminUser
        arguments:
            - '@cm.repository.admin_user'
            - '@cm.hasher.user_password'

    cm.create_app_user_invitation:
        class: CongregationManager\Bundle\User\Action\CreateAppUserInvitation
        arguments:
            - '@cm.generator.token'
            - '@cm.repository.app_user_invitation'

    cm.create_province:
        class: CongregationManager\Component\TerritoryManager\Application\CreateProvince
        arguments:
            - '@cm.repository.province'

    cm.create_municipality:
        class: CongregationManager\Component\TerritoryManager\Application\CreateMunicipality
        arguments:
            - '@cm.repository.municipality'

    cm.create_area:
        class: CongregationManager\Component\TerritoryManager\Application\CreateArea
        arguments:
            - '@cm.repository.area'

    cm.create_territory:
        class: CongregationManager\Component\TerritoryManager\Application\CreateTerritory
        arguments:
            - '@cm.repository.territory'

    cm.create_territory_assignment:
        class: CongregationManager\Component\TerritoryManager\Application\CreateTerritoryAssignment
        arguments:
            - '@cm.repository.territory_assignment'
