services:
    _defaults:
        autowire: false
        autoconfigure: false
        public: false

    cm.twig.extension.test_html_attribute:
        class: CongregationManager\Infrastructure\Common\Twig\TestHtmlAttributeExtension
        arguments:
            - '%kernel.environment%'
        tags:
            - { name: twig.extension }

    cm.twig.extension.locale:
        class: CongregationManager\Infrastructure\Common\Twig\LocaleExtension
        tags:
            - { name: twig.extension }

    cm.twig.runtime.locale:
        class: CongregationManager\Infrastructure\Common\Twig\LocaleRuntime
        arguments:
            - '@cm.converter.locale'
            - '@cm.context.locale'
        tags:
            - { name: twig.runtime }
