services:
    _defaults:
        autowire: false
        autoconfigure: false
        public: false

    cm.controller.homepage:
        class: CongregationManager\Infrastructure\Common\Controller\HomePageController
        arguments:
            - '%supported_locales%'
        calls:
            - [ setContainer, [ '@Psr\Container\ContainerInterface' ] ]
        tags: [ 'container.service_subscriber', 'controller.service_arguments' ]

    cm.controller.app_locale:
        class: CongregationManager\Infrastructure\Common\Controller\AppLocaleController
        arguments:
            - '%supported_locales%'
            - '@request_stack'
            - '@security.helper'
            - '@doctrine.orm.entity_manager'
        calls:
            - [ setContainer, [ '@Psr\Container\ContainerInterface' ] ]
        tags: [ 'container.service_subscriber', 'controller.service_arguments' ]

    cm.controller.app_user_login:
        class: CongregationManager\Infrastructure\User\Controller\AppUserLoginController
        arguments:
            - '@security.authentication_utils'
        calls:
            - [ setContainer, [ '@Psr\Container\ContainerInterface' ] ]
        tags: [ 'container.service_subscriber', 'controller.service_arguments' ]

    cm.controller.app_dashboard:
        class: CongregationManager\Infrastructure\Common\Controller\AppDashboardController
        calls:
            - [ setContainer, [ '@Psr\Container\ContainerInterface' ] ]
        tags: [ 'container.service_subscriber', 'controller.service_arguments' ]

    cm.controller.admin_locale:
        class: CongregationManager\Infrastructure\Common\Controller\AdminLocaleController
        arguments:
            - '%supported_locales%'
            - '@request_stack'
            - '@security.helper'
            - '@doctrine.orm.entity_manager'
        calls:
            - [ setContainer, [ '@Psr\Container\ContainerInterface' ] ]
        tags: [ 'container.service_subscriber', 'controller.service_arguments' ]

    cm.controller.admin_user_login:
        class: CongregationManager\Infrastructure\User\Controller\AdminUserLoginController
        arguments:
            - '@security.authentication_utils'
        calls:
            - [ setContainer, [ '@Psr\Container\ContainerInterface' ] ]
        tags: [ 'container.service_subscriber', 'controller.service_arguments' ]

    cm.controller.admin_dashboard:
        class: CongregationManager\Infrastructure\Common\Controller\AdminDashboardController
        calls:
            - [ setContainer, [ '@Psr\Container\ContainerInterface' ] ]
        tags: [ 'container.service_subscriber', 'controller.service_arguments' ]

    cm.controller.reset_app_password:
        class: CongregationManager\Infrastructure\User\Controller\ResetAppPasswordController
        arguments:
            - '@symfonycasts.reset_password.helper'
            - '@doctrine.orm.entity_manager'
            - '@mailer.mailer'
            - '@security.user_password_hasher'
            - '@logger'
        calls:
            - [ setContainer, [ '@Psr\Container\ContainerInterface' ] ]
        tags: [ 'container.service_subscriber', 'controller.service_arguments' ]

    cm.controller.app_change_password:
        class: CongregationManager\Infrastructure\User\Controller\AppChangePasswordController
        arguments:
            - '@security.helper'
            - '@doctrine.orm.entity_manager'
            - '@translator'
            - '@security.user_password_hasher'
        calls:
            - [ setContainer, [ '@Psr\Container\ContainerInterface' ] ]
        tags: [ 'container.service_subscriber', 'controller.service_arguments' ]

    cm.controller.reset_admin_password:
        class: CongregationManager\Infrastructure\User\Controller\ResetAdminPasswordController
        arguments:
            - '@symfonycasts.reset_password.helper'
            - '@doctrine.orm.entity_manager'
            - '@mailer.mailer'
            - '@security.user_password_hasher'
            - '@logger'
        calls:
            - [ setContainer, [ '@Psr\Container\ContainerInterface' ] ]
        tags: [ 'container.service_subscriber', 'controller.service_arguments' ]

    cm.controller.app_profile:
        class: CongregationManager\Infrastructure\User\Controller\AppProfileController
        arguments:
            - '@security.helper'
            - '@doctrine.orm.entity_manager'
            - '@translator'
        calls:
            - [ setContainer, [ '@Psr\Container\ContainerInterface' ] ]
        tags: [ 'container.service_subscriber', 'controller.service_arguments' ]

    cm.controller.admin_profile:
        class: CongregationManager\Infrastructure\User\Controller\AdminProfileController
        arguments:
            - '@security.helper'
            - '@doctrine.orm.entity_manager'
            - '@translator'
        calls:
            - [ setContainer, [ '@Psr\Container\ContainerInterface' ] ]
        tags: [ 'container.service_subscriber', 'controller.service_arguments' ]

    cm.controller.admin_change_password:
        class: CongregationManager\Infrastructure\User\Controller\AdminChangePasswordController
        arguments:
            - '@security.helper'
            - '@doctrine.orm.entity_manager'
            - '@translator'
            - '@security.user_password_hasher'
        calls:
            - [ setContainer, [ '@Psr\Container\ContainerInterface' ] ]
        tags: [ 'container.service_subscriber', 'controller.service_arguments' ]
