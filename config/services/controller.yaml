services:
    _defaults:
        autowire: false
        autoconfigure: false
        public: false

    cm.controller.homepage:
        class: CongregationManager\Bundle\App\Controller\HomePageController
        arguments:
            - '%supported_locales%'
        calls:
            - [ setContainer, [ '@Psr\Container\ContainerInterface' ] ]
        tags: [ 'container.service_subscriber', 'controller.service_arguments' ]

    cm.controller.app_locale:
        class: CongregationManager\Bundle\App\Controller\AppLocaleController
        arguments:
            - '%supported_locales%'
            - '@request_stack'
            - '@security.helper'
            - '@doctrine.orm.entity_manager'
        calls:
            - [ setContainer, [ '@Psr\Container\ContainerInterface' ] ]
        tags: [ 'container.service_subscriber', 'controller.service_arguments' ]

