services:
    _defaults:
        autowire: false
        autoconfigure: false
        public: false

    cm.form.type.reset_password_request:
        class: CongregationManager\Bundle\User\Form\ResetPasswordRequestFormType
        tags:
            - { name: 'form.type' }

    cm.form.type.change_password:
        class: CongregationManager\Bundle\User\Form\ChangePasswordFormType
        tags:
            - { name: 'form.type' }

    cm.form.type.brother:
        class: CongregationManager\Bundle\Congregation\Form\UpdateBrotherFormType
        tags:
            - { name: 'form.type' }

    cm.form.type.email:
        class: CongregationManager\Bundle\User\Form\ChangeEmailFormType
        tags:
            - { name: 'form.type' }

    cm.form.type.profile_update:
        class: CongregationManager\Bundle\Core\Form\ProfileUpdateFormType
        tags:
            - { name: 'form.type' }

    cm.form.type.user_invite:
        class: CongregationManager\Bundle\User\Form\InviteUserFormType
        tags:
            - { name: 'form.type' }

    cm.form.type.complete_account:
        class: CongregationManager\Bundle\User\Form\CompleteAccountFormType
        tags:
            - { name: 'form.type' }

    cm.form.type.territory_filters:
        class: CongregationManager\Bundle\TerritoryManager\Form\TerritoryFiltersFormType
        tags:
            - { name: 'form.type' }

    cm.form.type.area:
        class: CongregationManager\Bundle\TerritoryManager\Form\AreaFormType
        arguments:
            - '@cm.context.congregation'
            - '@doctrine'
        tags:
            - { name: 'form.type' }
