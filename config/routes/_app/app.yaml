app_switch_locale:
    path: /switch-locale/{locale}
    methods: [GET]
    defaults:
        locale: '%supported_locales%'
        _controller: app.controller.locale:switchLocale

app_homepage:
    path: /
    methods: [GET]
    defaults:
        _controller: app.controller.homepage:index

app_login:
    path: /login
    methods: [GET]
    defaults:
        _controller: app.controller.app_user_login:index

app_login_check:
    path: /login-check
    methods: [POST]

app_logout:
    path: /logout
    methods: GET

app_dashboard:
    path: /dashboard
    methods: [GET]
    defaults:
        _controller: app.controller.app_dashboard:index

app_profile_update:
    path: /profile/update
    methods: [GET, POST]
    defaults:
        _controller: app.controller.app_profile:update

app_change_password:
    path: /password/update
    methods: [GET, POST]
    defaults:
        _controller: app.controller.app_change_password:update
