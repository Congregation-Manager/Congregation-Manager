---
-
    name: Install Apache web server
    become: true
    apt:
        name:
            - apache2
            - libapache2-mod-fcgid
        state: latest
    notify: Restart Apache

-
    name: Set right permissions for Apache log directory
    become: true
    file:
        path: "/var/log/apache2"
        state: directory
        recurse: yes
        mode: '744'

-
    name: Add logs directory for project
    become: true
    file:
        path: "/var/log/apache2/{{ server_name }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        recurse: yes
        mode: '744'

-
    name: Add Project config template to the Apache available sites
    become: true
    template:
        src: templates/apache.conf
        dest: "/etc/apache2/sites-available/{{ server_name }}.conf"
    notify: Restart Apache

-
    name: Enable Project config template from Apache available sites
    become: true
    file:
        src: "/etc/apache2/sites-available/{{ server_name }}.conf"
        dest: "/etc/apache2/sites-enabled/{{ server_name }}.conf"
        state: link
    notify: Restart Apache

-
    name: Add enabled Apache site to /etc/hosts
    become: true
    lineinfile:
        dest: /etc/hosts
        regexp: "{{ server_name }}"
        line: "127.0.0.1 {{ server_name }}"
