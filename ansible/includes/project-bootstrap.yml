---
-
    name: Install Composer's dependencies
    composer:
        working_dir: "{{ project_root_dir }}"
        no_dev: "{{ 'yes' if ('prod' == project_env) else 'no' }}"
    # when: code_changed | bool
    tags:
        - deploy

-
    name: Fix var directory permissions
    file:
        path: "{{ project_var_dir }}"
        state: directory
        mode: 0777
        recurse: yes
    changed_when: false
    tags:
        - deploy

-
    name: Set Symfony secret in parameters.yml
    lineinfile:
        dest: "{{ project_root_dir }}/app/config/parameters.yml"
        regexp: "^    secret:"
        line: "    secret: {{ project_secret }}"
    tags:
        - deploy

